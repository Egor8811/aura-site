```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VexionAI 2.0 — Aura</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --aura-color: #6677ff;
    --aura-glow: #596aff;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    color: white;
    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(
            circle at 50% 40%,
            #171d46 0%,
            #080a18 38%,
            #020309 80%
        );
}

/* PARTICLES */

#particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}

.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: white;
    opacity: .5;

    animation: float linear infinite;
}

@keyframes float {
    from {
        transform: translateY(110vh);
    }

    to {
        transform: translateY(-10vh);
    }
}

/* HEADER */

header {
    position: relative;
    z-index: 5;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 22px 7%;

    background: rgba(2,3,9,.65);
    border-bottom: 1px solid rgba(255,255,255,.08);

    backdrop-filter: blur(18px);
}

.logo {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 4px;
}

.logo span {
    opacity: .4;
}

.stats {
    display: flex;
    gap: 25px;
}

.stat {
    color: #777d99;
    font-size: 12px;
}

.stat b {
    display: block;
    color: white;
    font-size: 17px;
    margin-top: 3px;
}

/* MAIN */

main {
    position: relative;
    z-index: 1;

    width: min(1100px, 92%);
    margin: auto;

    padding: 55px 0;
}

.hero {
    text-align: center;
}

.hero h1 {
    font-size: clamp(52px, 10vw, 110px);
    letter-spacing: -6px;

    text-shadow:
        0 0 30px rgba(100,120,255,.3);
}

.hero p {
    margin-top: 15px;
    color: #777d99;
}

/* ARENA */

.arena {
    min-height: 530px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
}

/* AURA */

.aura-container {
    position: relative;

    width: 300px;
    height: 300px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    user-select: none;
}

.aura-container:hover .aura-core {
    transform: scale(1.12);
}

.aura-ring {
    position: absolute;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    border: 2px solid color-mix(
        in srgb,
        var(--aura-color),
        transparent 70%
    );

    box-shadow:
        0 0 35px color-mix(
            in srgb,
            var(--aura-color),
            transparent 60%
        );

    animation: rotate 9s linear infinite;
}

.aura-ring:nth-child(2) {
    width: 82%;
    height: 82%;

    animation-duration: 6s;
    animation-direction: reverse;
}

.aura-ring:nth-child(3) {
    width: 63%;
    height: 63%;

    animation-duration: 4s;
}

@keyframes rotate {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

.aura-core {
    width: 125px;
    height: 125px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            white 0%,
            var(--aura-color) 25%,
            var(--aura-glow) 45%,
            transparent 72%
        );

    box-shadow:
        0 0 35px var(--aura-color),
        0 0 80px var(--aura-glow),
        0 0 150px var(--aura-color);

    transition: .25s;

    animation: pulse 1.8s ease-in-out infinite;
}

@keyframes pulse {
    0%,100% {
        transform: scale(.9);
    }

    50% {
        transform: scale(1.08);
    }
}

.click-text {
    position: absolute;

    bottom: -45px;

    width: 100%;

    color: #7f85a3;

    font-size: 13px;
    letter-spacing: 2px;

    pointer-events: none;
}

/* LEVEL */

.level {
    margin-top: 65px;
}

.aura-name {
    font-size: 30px;
    font-weight: 900;
}

.rarity {
    margin-top: 8px;

    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
}

.level-number {
    margin-top: 12px;
    color: #777d99;
}

.xp-box {
    width: min(500px, 90vw);
    margin: 20px auto;
}

.xp-bar {
    height: 9px;

    overflow: hidden;

    border-radius: 20px;

    background: rgba(255,255,255,.07);
}

.xp-fill {
    width: 0%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            var(--aura-color),
            white
        );

    box-shadow: 0 0 20px var(--aura-color);

    transition: width .4s;
}

.xp-text {
    margin-top: 8px;

    color: #666c87;
    font-size: 12px;
}

/* BUTTONS */

.controls {
    display: flex;
    justify-content: center;

    gap: 12px;

    margin-top: 20px;
}

button {
    padding: 14px 25px;

    border: 0;
    border-radius: 12px;

    color: white;

    font-weight: 900;
    letter-spacing: 1px;

    cursor: pointer;

    transition: .2s;
}

button:hover {
    transform: translateY(-3px);
}

.auto {
    background: rgba(255,255,255,.07);

    border: 1px solid rgba(255,255,255,.1);
}

.auto.active {
    background: linear-gradient(
        135deg,
        #5bff9b,
        #21b969
    );

    box-shadow:
        0 0 25px rgba(60,255,150,.35);
}

/* LAST RESULT */

.last-result {
    margin-top: 25px;

    color: #777d99;

    font-size: 13px;
}

.last-result strong {
    color: white;
}

/* COLLECTION */

.section {
    margin-top: 70px;
}

.section-title {
    margin-bottom: 20px;

    font-size: 25px;
}

.collection {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(170px,1fr));

    gap: 14px;
}

.card {
    padding: 20px;

    border-radius: 17px;

    background: rgba(255,255,255,.045);

    border: 1px solid rgba(255,255,255,.07);

    transition: .25s;
}

.card:hover {
    transform: translateY(-5px);

    background: rgba(255,255,255,.08);
}

.card-icon {
    font-size: 30px;

    margin-bottom: 15px;
}

.card-name {
    font-weight: 900;
}

.card-rarity {
    margin-top: 7px;

    font-size: 11px;
    letter-spacing: 1px;
}

.locked {
    opacity: .3;
    filter: grayscale(1);
}

/* RARITIES */

.common {
    color: #aaa;
}

.rare {
    color: #54c9ff;
}

.epic {
    color: #b979ff;
}

.legendary {
    color: #ffd45c;
}

.mythic {
    color: #ff62f5;

    text-shadow:
        0 0 15px #ff62f5;
}

/* NOTIFICATION */

#notification {
    position: fixed;

    left: 50%;
    bottom: 30px;

    z-index: 20;

    transform:
        translate(-50%, 30px);

    padding: 14px 24px;

    border-radius: 13px;

    background: rgba(7,9,20,.92);

    border:
        1px solid rgba(255,255,255,.1);

    backdrop-filter: blur(15px);

    opacity: 0;

    transition: .3s;
}

#notification.show {
    opacity: 1;

    transform:
        translate(-50%, 0);
}

/* CLICK EFFECT */

.click-effect {
    position: fixed;

    width: 15px;
    height: 15px;

    border-radius: 50%;

    pointer-events: none;

    border: 2px solid var(--aura-color);

    animation: clickEffect .7s ease-out forwards;

    z-index: 50;
}

@keyframes clickEffect {
    from {
        transform: scale(1);
        opacity: 1;
    }

    to {
        transform: scale(8);
        opacity: 0;
    }
}

/* FOOTER */

footer {
    padding: 70px 20px 30px;

    text-align: center;

    color: #41465d;

    font-size: 12px;
}

/* MOBILE */

@media(max-width:600px) {

    header {
        padding: 18px 5%;
    }

    .stats {
        gap: 12px;
    }

    .aura-container {
        width: 235px;
        height: 235px;
    }

    .aura-core {
        width: 100px;
        height: 100px;
    }

    .arena {
        min-height: 470px;
    }

    .controls {
        flex-direction: column;
    }

    button {
        width: 220px;
    }
}
</style>
</head>

<body>

<div id="particles"></div>

<header>

    <div class="logo">
        VEXION<span>AI_2.0</span>
    </div>

    <div class="stats">

        <div class="stat">
            ENERGY
            <b id="energy">100</b>
        </div>

        <div class="stat">
            AURAS
            <b id="auraCount">0</b>
        </div>

    </div>

</header>

<main>

<section class="hero">

    <h1>AWAKEN.</h1>

    <p>
        Discover the aura hidden inside you.
    </p>

</section>

<section class="arena">

    <!-- CLICK THIS -->
    <div
        class="aura-container"
        id="auraButton"
        title="Нажми, чтобы получить ауру"
    >

        <div class="aura-ring"></div>
        <div class="aura-ring"></div>
        <div class="aura-ring"></div>

        <div class="aura-core"></div>

        <div class="click-text">
            CLICK TO AWAKEN
        </div>

    </div>

    <div class="level">

        <div
            class="aura-name"
            id="auraName"
        >
            Unknown Aura
        </div>

        <div
            class="rarity common"
            id="rarity"
        >
            UNKNOWN
        </div>

        <div class="level-number">

            LEVEL
            <span id="level">1</span>

        </div>

        <div class="xp-box">

            <div class="xp-bar">

                <div
                    class="xp-fill"
                    id="xpFill"
                ></div>

            </div>

            <div class="xp-text">

                <span id="xp">0</span>
                / 100 XP

            </div>

        </div>

        <div class="controls">

            <button
                class="auto"
                id="autoButton"
            >
                🤖 AUTO: OFF
            </button>

        </div>

        <div class="last-result">

            LAST AURA:
            <strong id="lastAura">
                None
            </strong>

        </div>

    </div>

</section>

<section class="section">

    <h2 class="section-title">
        AURA COLLECTION
    </h2>

    <div
        class="collection"
        id="collection"
    ></div>

</section>

</main>

<footer>

    VEXIONAI_2.0 — AURA CORE

</footer>

<div id="notification"></div>

<script>

/* ================================
   AURAS
================================ */

const auras = [

    {
        name: "Void",
        icon: "🌑",
        rarity: "COMMON",
        chance: 55,
        className: "common",
        color: "#7777ff"
    },

    {
        name: "Frost",
        icon: "❄️",
        rarity: "RARE",
        chance: 25,
        className: "rare",
        color: "#54c9ff"
    },

    {
        name: "Thunder",
        icon: "⚡",
        rarity: "EPIC",
        chance: 13,
        className: "epic",
        color: "#ad65ff"
    },

    {
        name: "Solar",
        icon: "☀️",
        rarity: "LEGENDARY",
        chance: 6,
        className: "legendary",
        color: "#ffd45c"
    },

    {
        name: "Eternal",
        icon: "💠",
        rarity: "MYTHIC",
        chance: 1,
        className: "mythic",
        color: "#ff62f5"
    }

];


/* ================================
   GAME DATA
================================ */

let game =
    JSON.parse(
        localStorage.getItem("vexionAura")
    ) || {

        energy: 100,

        level: 1,

        xp: 0,

        collection: [],

        currentAura: "Unknown Aura",

        currentRarity: "UNKNOWN",

        lastAura: "None"

    };


let autoMode = false;

let autoTimer = null;


/* ================================
   SAVE
================================ */

function saveGame() {

    localStorage.setItem(
        "vexionAura",
        JSON.stringify(game)
    );

}


/* ================================
   PARTICLES
================================ */

const particleContainer =
    document.getElementById("particles");

for(let i = 0; i < 80; i++) {

    const p =
        document.createElement("div");

    p.className = "particle";

    p.style.left =
        Math.random() * 100 + "%";

    p.style.animationDuration =
        (5 + Math.random() * 12) + "s";

    p.style.animationDelay =
        Math.random() * 10 + "s";

    p.style.opacity =
        Math.random() * .7;

    particleContainer.appendChild(p);

}


/* ================================
   ROLL AURA
================================ */

function rollAura() {

    if(game.energy < 10) {

        notify(
            "⚡ Недостаточно энергии!"
        );

        return;

    }


    game.energy -= 10;


    const random =
        Math.random() * 100;


    let total = 0;

    let selected =
        auras[0];


    for(const aura of auras) {

        total += aura.chance;

        if(random <= total) {

            selected = aura;

            break;

        }

    }


    game.currentAura =
        selected.name;

    game.currentRarity =
        selected.rarity;

    game.lastAura =
        selected.name;


    if(
        !game.collection
            .includes(selected.name)
    ) {

        game.collection.push(
            selected.name
        );

    }


    game.xp += 20;


    if(game.xp >= 100) {

        game.xp -= 100;

        game.level++;

        notify(
            "🔥 LEVEL UP!"
        );

    }


    saveGame();

    updateUI();

    auraBurst(
        selected
    );

}


/* ================================
   AURA EFFECT
================================ */

function auraBurst(aura) {

    document.documentElement.style
        .setProperty(
            "--aura-color",
            aura.color
        );

    document.documentElement.style
        .setProperty(
            "--aura-glow",
            aura.color
        );


    const core =
        document.querySelector(
            ".aura-core"
        );


    core.animate(

        [
            {
                transform:
                    "scale(1)"
            },

            {
                transform:
                    "scale(1.7)"
            },

            {
                transform:
                    "scale(1)"
            }

        ],

        {
            duration: 700,
            easing: "ease-out"
        }

    );

}


/* ================================
   CLICK EFFECT
================================ */

document
    .getElementById("auraButton")
    .addEventListener(
        "click",
        function(event) {

            createClickEffect(
                event.clientX,
                event.clientY
            );

            rollAura();

        }
    );


function createClickEffect(x,y) {

    const effect =
        document.createElement(
            "div"
        );

    effect.className =
        "click-effect";

    effect.style.left =
        x - 7 + "px";

    effect.style.top =
        y - 7 + "px";

    document.body.appendChild(
        effect
    );


    setTimeout(
        () => effect.remove(),
        700
    );

}


/* ================================
   AUTO
================================ */

document
    .getElementById("autoButton")
    .addEventListener(
        "click",
        toggleAuto
    );


function toggleAuto() {

    autoMode =
        !autoMode;


    const button =
        document.getElementById(
            "autoButton"
        );


    if(autoMode) {

        button.textContent =
            "🤖 AUTO: ON";

        button.classList.add(
            "active"
        );


        notify(
            "AUTO AURA включён"
        );


        rollAura();


        autoTimer =
            setInterval(
                () => {

                    if(game.energy < 10) {

                        toggleAuto();

                        notify(
                            "AUTO остановлен — нет энергии"
                        );

                        return;

                    }

                    rollAura();

                },

                1200
            );

    }

    else {

        button.textContent =
            "🤖 AUTO: OFF";

        button.classList.remove(
            "active"
        );


        clearInterval(
            autoTimer
        );

        autoTimer = null;

    }

}


/* ================================
   UPDATE UI
================================ */

function updateUI() {

    document.getElementById(
        "energy"
    ).textContent =
        game.energy;


    document.getElementById(
        "level"
    ).textContent =
        game.level;


    document.getElementById(
        "xp"
    ).textContent =
        game.xp;


    document.getElementById(
        "xpFill"
    ).style.width =
        game.xp + "%";


    document.getElementById(
        "auraName"
    ).textContent =
        game.currentAura;


    document.getElementById(
        "lastAura"
    ).textContent =
        game.lastAura;


    document.getElementById(
        "auraCount"
    ).textContent =
        game.collection.length;


    const rarity =
        document.getElementById(
            "rarity"
        );


    rarity.textContent =
        game.currentRarity;


    rarity.className =
        "rarity";


    const current =
        auras.find(
            a =>
                a.name ===
                game.currentAura
        );


    if(current) {

        rarity.classList.add(
            current.className
        );

        document.documentElement.style
            .setProperty(
                "--aura-color",
                current.color
            );

        document.documentElement.style
            .setProperty(
                "--aura-glow",
                current.color
            );

    }


    renderCollection();

}


/* ================================
   COLLECTION
================================ */

function renderCollection() {

    const container =
        document.getElementById(
            "collection"
        );


    container.innerHTML = "";


    for(const aura of auras) {

        const unlocked =
            game.collection
                .includes(aura.name);


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "card" +
            (
                unlocked
                    ? ""
                    : " locked"
            );


        card.innerHTML = `

            <div class="card-icon">
                ${
                    unlocked
                        ? aura.icon
                        : "?"
                }
            </div>

            <div class="card-name">
                ${
                    unlocked
                        ? aura.name
                        : "Unknown"
                }
            </div>

            <div
                class="card-rarity ${aura.className}"
            >
                ${
                    unlocked
                        ? aura.rarity
                        : "LOCKED"
                }
            </div>

        `;


        container.appendChild(
            card
        );

    }

}


/* ================================
   ENERGY REGEN
================================ */

setInterval(
    () => {

        if(game.energy < 100) {

            game.energy++;

            saveGame();

            updateUI();

        }

    },

    3000
);


/* ================================
   NOTIFICATION
================================ */

let notificationTimer;


function notify(text) {

    const notification =
        document.getElementById(
            "notification"
        );


    notification.textContent =
        text;


    notification.classList.add(
        "show"
    );


    clearTimeout(
        notificationTimer
    );


    notificationTimer =
        setTimeout(
            () => {

                notification
                    .classList.remove(
                        "show"
                    );

            },

            2200
        );

}


/* ================================
   START
================================ */

updateUI();

</script>

</body>
</html>
```
