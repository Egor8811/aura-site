<!DOCTYPE html>

<title>VexionAI_2.0 — Aura</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --aura: #6575ff;
    --glow: #6575ff;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    color: white;
    font-family: Arial, sans-serif;

    background:
        radial-gradient(
            circle at 50% 35%,
            #18204b 0%,
            #090b1d 38%,
            #02030a 80%
        );
}

/* PARTICLES */

#particles {
    position: fixed;
    inset: 0;

    pointer-events: none;

    z-index: 0;
}

.particle {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: white;

    opacity: .45;

    animation: float linear infinite;
}

@keyframes float {

    from {
        transform: translateY(110vh);
    }

    to {
        transform: translateY(-10vh);
    }

}

/* HEADER */

header {

    position: relative;

    z-index: 5;

    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 20px 7%;

    background:
        rgba(2,3,10,.7);

    border-bottom:
        1px solid rgba(255,255,255,.08);

    backdrop-filter:
        blur(18px);
}

.logo {

    font-size: 24px;

    font-weight: 900;

    letter-spacing: 4px;
}

.logo span {

    opacity: .35;
}

.stats {

    display: flex;

    gap: 22px;
}

.stat {

    color: #777d99;

    font-size: 11px;
}

    color: white;

    font-size: 17px;

}

/* MAIN */

main {

    position: relative;

    z-index: 1;

    width: min(1100px,92%);

    margin: auto;

    padding: 50px 0;
}

.hero {

    text-align: center;
}

.hero h1 {

    font-size:
        clamp(50px,10vw,105px);

    letter-spacing: -6px;

    text-shadow:
        0 0 45px
        rgba(100,120,255,.35);
}

.hero p {

    margin-top: 15px;

    color: #777d99;
}

/* ARENA */

.arena {

    min-height: 520px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;
}

/* AURA */

.aura-container {

    position: relative;

    width: 300px;
    height: 300px;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    user-select: none;
}

.aura-container:hover
.aura-core {

    transform:
        scale(1.13);
}

.aura-ring {

    position: absolute;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    border:
        2px solid
        var(--aura);

    opacity: .25;

    box-shadow:
        0 0 35px
        var(--glow);

    animation:
        rotate 9s linear infinite;
}

.aura-ring:nth-child(2) {

    width: 82%;
    height: 82%;

    animation-duration: 6s;

    animation-direction:
        reverse;
}

.aura-ring:nth-child(3) {

    width: 64%;
    height: 64%;

    animation-duration: 4s;
}

@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}

.aura-core {

    width: 125px;
    height: 125px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            white 0%,
            var(--aura) 25%,
            var(--glow) 48%,
            transparent 72%
        );

    box-shadow:
        0 0 35px var(--aura),
        0 0 80px var(--glow),
        0 0 150px var(--aura);

    transition: .25s;

    animation:
        pulse 1.8s ease-in-out infinite;
}

@keyframes pulse {

    0%,100% {
        transform: scale(.9);
    }

    50% {
        transform: scale(1.08);
    }

}

.click-text {

    position: absolute;

    bottom: -45px;

    width: 100%;

    color: #777d99;

    font-size: 12px;

    letter-spacing: 2px;

    pointer-events: none;
}

.level-number {

}

.energy-info {

}

.energy-bar {

    height: 8px;

    border-radius: 20px;

    overflow: hidden;

    background:
        rgba(255,255,255,.07);
}

.energy-fill {

    height: 100%;

        linear-gradient(

        0 0 15px #6575ff;

}

.upgrade {

    margin-top: 15px;

        linear-gradient(

        0 8px 25px

.upgrade:disabled {

    opacity: .4;

/* COLLECTION */

.section {

    margin-top: 70px;
}

.section-title {

    margin-bottom: 20px;

    font-size: 25px;
}

.collection {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(170px,1fr)
        );

    gap: 14px;
}

.card {

    padding: 20px;

    border-radius: 17px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.07);

    transition: .25s;
}

.card:hover {

    transform:
        translateY(-5px);

    background:
        rgba(255,255,255,.08);
}

.card-icon {

    font-size: 30px;

}

.card-name {

    font-weight: 900;
}

.card-rarity {

}

.locked {

}

/* RARITIES */

.common {

}

.rare {

}

}

/* RESULT */

.last-result {

    margin-top: 25px;

    color: #777d99;

    font-size: 13px;
}

.last-result strong {

    color: white;
}

/* NOTIFICATION */

#notification {

    position: fixed;

    left: 50%;
    bottom: 30px;

    z-index: 30;

    transform:
        translate(-50%,30px);

    padding:
        14px 24px;

    background:
        rgba(6,8,18,.95);

    border:
        1px solid

    opacity: 0;

    transition: .3s;
}

#notification.show {

    opacity: 1;

        translate(-50%,0);
}

/* FOOTER */

footer {

    padding:
        70px 20px 30px;

    text-align: center;

    color: #41465d;

    font-size: 12px;
}

/* MOBILE */

@media(max-width:600px) {

    header {
        padding: 18px 5%;
    }

    }

    }

    .controls {
        flex-direction: column;
        align-items: center;
    }

    }

}

</style>

<script>

        chance:.001,
        className:"secret",
        color:"#ffffff"
    }

];


/* ======================================
   GAME
====================================== */

let game =
JSON.parse(
    localStorage.getItem(
        "vexionAura"
    )
) || {

    energy:100,

    maxEnergy:100,

    energyLevel:1,

    energyUpgradeCost:100,

    level:1,

    xp:0,

    collection:[],

    currentAura:"Unknown Aura",

    currentRarity:"UNKNOWN",

    lastAura:"None"

};


let autoMode = false;

let autoTimer = null;


/* ======================================
   SAVE
====================================== */

function saveGame(){

    localStorage.setItem(
        "vexionAura",
        JSON.stringify(game)
    );

}


/* ======================================
   PARTICLES
====================================== */

const particles =
document.getElementById(
    "particles"
);

for(
    let i=0;
    i<90;
    i++
){

    const p =
    document.createElement(
        "div"
    );

    p.className =
        "particle";

    p.style.left =
        Math.random()*100+"%";

    p.style.animationDuration =
        (5+Math.random()*12)+"s";

    p.style.animationDelay =
        Math.random()*10+"s";

    p.style.opacity =
        Math.random()*.7;

    particles.appendChild(p);

}


/* ======================================
   ROLL
====================================== */

function rollAura(){

    if(
        game.energy < 10
    ){

        notify(
            "⚡ Нужна энергия!"
        );

        return;
    }


    game.energy -= 10;


    const random =
        Math.random()*100;


    let total=0;

    let selected =
        auras[0];


    for(
        const aura of auras
    ){

        total +=
            aura.chance;

        if(
            random <= total
        ){

            selected =
                aura;

            break;

        }

    }


    game.currentAura =
        selected.name;

    game.currentRarity =
        selected.rarity;

    game.lastAura =
        selected.name;


    if(
        !game.collection
        .includes(selected.name)
    ){

        game.collection.push(
            selected.name
        );

    }


    game.xp += 20;


    if(
        game.xp >= 100
    ){

        game.xp -= 100;

        game.level++;

        notify(
            "🔥 LEVEL UP!"
        );

    }


    saveGame();

    updateUI();

    auraBurst(
        selected
    );

}


/* ======================================
   AURA EFFECT
====================================== */

function auraBurst(aura){

    document.documentElement
    .style
    .setProperty(
        "--aura",
        aura.color
    );

    document.documentElement
    .style
    .setProperty(
        "--glow",
        aura.color
    );


    const core =
        document.querySelector(
            ".aura-core"
        );


    core.animate(

        [

            {
                transform:
                    "scale(1)"
            },

            {
                transform:
                    "scale(1.8)"
            },

            {
                transform:
                    "scale(1)"
            }

        ],

        {

            duration:700,

            easing:
                "ease-out"

        }

    );

}


/* ======================================
   CLICK
====================================== */

document
.getElementById(
    "auraButton"
)
.addEventListener(
    "click",
    rollAura
);


/* ======================================
   AUTO
====================================== */

document
.getElementById(
    "autoButton"
)
.addEventListener(
    "click",
    toggleAuto
);


function toggleAuto(){

    autoMode =
        !autoMode;


    const button =
        document.getElementById(
            "autoButton"
        );


    if(
        autoMode
    ){

        button.textContent =
            "🤖 AUTO: ON";

        button.classList.add(
            "active"
        );


        notify(
            "AUTO включён"
        );


        rollAura();


        autoTimer =
            setInterval(
                () => {

                    if(
                        game.energy < 10
                    ){

                        toggleAuto();

                        notify(
                            "AUTO остановлен"
                        );

                        return;

                    }

                    rollAura();

                },
                1200
            );

    }

    else{

        button.textContent =
            "🤖 AUTO: OFF";

        button.classList.remove(
            "active"
        );


        clearInterval(
            autoTimer
        );

        autoTimer =
            null;

    }

}


/* ======================================
   ENERGY UPGRADE
====================================== */

document
.getElementById(
    "upgradeButton"
)
.addEventListener(
    "click",
    upgradeEnergy
);


function upgradeEnergy(){

    if(
        game.energy <
        game.energyUpgradeCost
    ){

        notify(
            "💰 Недостаточно энергии для улучшения!"
        );

        return;

    }


    game.energy -=
        game.energyUpgradeCost;


    game.energyLevel++;


    game.maxEnergy =
        Math.floor(
            game.maxEnergy * 1.5
        );


    game.energy =
        game.maxEnergy;


    game.energyUpgradeCost =
        Math.floor(
            game.energyUpgradeCost * 1.7
        );


    notify(
        "🔋 ENERGY CORE UPGRADED!"
    );


    saveGame();

    updateUI();

}


/* ======================================
   UI
====================================== */

function updateUI(){

    document.getElementById(
        "energy"
    ).textContent =
        game.energy;


    document.getElementById(
        "maxEnergy"
    ).textContent =
        game.maxEnergy;


    document.getElementById(
        "auraCount"
    ).textContent =
        game.collection.length;


    document.getElementById(
        "level"
    ).textContent =
        game.level;


    document.getElementById(
        "xp"
    ).textContent =
        game.xp;


    document.getElementById(
        "xpFill"
    ).style.width =
        game.xp+"%";


    document.getElementById(
        "auraName"
    ).textContent =
        game.currentAura;


    document.getElementById(
        "lastAura"
    ).textContent =
        game.lastAura;


    const energyPercent =
        Math.min(
            100,
            (
                game.energy /
                game.maxEnergy
            )*100
        );


    document.getElementById(
        "energyFill"
    ).style.width =
        energyPercent+"%";


    document.getElementById(
        "energyInfo"
    ).textContent =
        game.energy +
        " / " +
        game.maxEnergy +
        " ENERGY";


    const upgradeButton =
        document.getElementById(
            "upgradeButton"
        );


    upgradeButton.textContent =
        "🔋 UPGRADE ENERGY • " +
        game.energyUpgradeCost;


    upgradeButton.disabled =
        game.energy <
        game.energyUpgradeCost;


    const rarity =
        document.getElementById(
            "rarity"
        );


    rarity.textContent =
        game.currentRarity;


    rarity.className =
        "rarity";


    const current =
        auras.find(
            aura =>
                aura.name ===
                game.currentAura
        );


    if(current){

        rarity.classList.add(
            current.className
        );


        document.documentElement
        .style
        .setProperty(
            "--aura",
            current.color
        );


        document.documentElement
        .style
        .setProperty(
            "--glow",
            current.color
        );

    }


    renderCollection();

}


/* ======================================
   COLLECTION
====================================== */

function renderCollection(){

    const container =
        document.getElementById(
            "collection"
        );


    container.innerHTML =
        "";


    for(
        const aura of auras
    ){

        const unlocked =
            game.collection
            .includes(
                aura.name
            );


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "card"+
            (
                unlocked
                ? ""
                : " locked"
            );


        card.innerHTML = `

            <div class="card-icon">

                ${
                    unlocked
                    ? aura.icon
                    : "?"
                }

            </div>

            <div class="card-name">

                ${
                    unlocked
                    ? aura.name
                    : "Unknown"
                }

            </div>

            <div
                class="card-rarity
                ${aura.className}"
            >

                ${
                    unlocked
                    ? aura.rarity
                    : "LOCKED"
                }

            </div>

        `;


        container.appendChild(
            card
        );

    }

}


/* ======================================
   ENERGY REGEN
====================================== */

setInterval(

    () => {

        if(
            game.energy <
            game.maxEnergy
        ){

            game.energy += 2;

            if(
                game.energy >
                game.maxEnergy
            ){

                game.energy =
                    game.maxEnergy;

            }

            saveGame();

            updateUI();

        }

    },

    3000

);


/* ======================================
   NOTIFICATIONS
====================================== */

let notificationTimer;


function notify(text){

    const n =
        document.getElementById(
            "notification"
        );


    n.textContent =
        text;


    n.classList.add(
        "show"
    );


    clearTimeout(
        notificationTimer
    );


    notificationTimer =
        setTimeout(

            () => {

                n.classList.remove(
                    "show"
                );

            },

            2200

        );

}


/* ======================================
   START
====================================== */

updateUI();

</script>
